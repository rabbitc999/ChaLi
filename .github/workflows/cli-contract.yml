name: Command and documentation gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: CLI, project configuration and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Detect obsolete commands and documentation drift
        run: |
          python tests/chali_cli_contract.py
          python tests/chali_doc_history.py
      - name: Check changelog consistency
        run: python tools/changelog.py --check
      - name: Verify generated translations are synchronized
        run: |
          python tools/embed_i18n.py
          git diff --exit-code -- source/chali_i18n.hpp tools/chalidev.py
      - name: Exercise actual argument normalization
        run: |
          mkdir -p tmp
          g++ -std=c++17 -Wall -Wextra -Werror tests/chali_cli_test.cpp -o tmp/chali-cli-test
          tmp/chali-cli-test
      - name: Check editor build configuration and project integration
        working-directory: vscode
        run: |
          node test/llvmConfiguration.js
          node test/editorIntegration.js
      - name: Check generated sources for whitespace errors
        run: git show --format= --check HEAD
