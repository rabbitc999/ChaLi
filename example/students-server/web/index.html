<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生信息管理系统</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --danger: #dc2626;
    --ok: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff; padding: 28px 32px;
  }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { margin-top: 6px; font-size: 13px; opacity: .85; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 32px 64px; }
  .cards { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .card {
    flex: 1; min-width: 160px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 20px;
  }
  .card .num { font-size: 26px; font-weight: 700; color: var(--brand-dark); }
  .card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
  }
  input, select {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    font-size: 14px; background: #fff; color: var(--ink); outline: none;
  }
  input:focus, select:focus { border-color: var(--brand); }
  #search { width: 220px; }
  button {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px;
    cursor: pointer; background: var(--brand); color: #fff;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { border-color: var(--brand); color: var(--brand); }
  button.danger { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
  button.danger:hover { background: #fef2f2; }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
  th { background: #f9fafb; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
  th .arrow { font-size: 11px; margin-left: 4px; color: var(--brand); }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr:hover { background: #f8faff; }
  td.actions { white-space: nowrap; }
  td.actions button { padding: 5px 12px; font-size: 13px; margin-right: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0 !important; }
  .mask {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45);
    align-items: center; justify-content: center;
  }
  .mask.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 14px; padding: 24px 28px; width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
  }
  .dialog h2 { font-size: 17px; margin-bottom: 16px; }
  .dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .dialog input { width: 100%; }
  .dialog .row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }
  #toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 20px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 70vw;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>学生信息管理系统</h1>
  <p>ChaLi 反射 + MySQL —— 模型一份声明，接口、建表、校验全部派生</p>
</header>
<main>
  <div class="cards">
    <div class="card"><div class="num" id="stat-count">0</div><div class="label">学生总数</div></div>
    <div class="card"><div class="num" id="stat-avg">-</div><div class="label">平均成绩</div></div>
    <div class="card"><div class="num" id="stat-max">-</div><div class="label">最高成绩</div></div>
    <div class="card"><div class="num" id="stat-schema">-</div><div class="label">模型字段数（反射）</div></div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="按姓名搜索…">
    <button class="ghost" onclick="load()">搜索</button>
    <button class="ghost" onclick="clearSearch()">清空</button>
    <span style="flex:1"></span>
    <button onclick="openAdd()">＋ 新增学生</button>
  </div>

  <table>
    <thead>
      <tr id="head-row"></tr>
    </thead>
    <tbody id="rows"><tr><td class="empty" colspan="9">加载中…</td></tr></tbody>
  </table>
</main>

<div class="mask" id="mask">
  <div class="dialog">
    <h2 id="dialog-title">新增学生</h2>
    <label>学号（留空自动分配）</label><input id="f-id" type="number" min="1">
    <label>姓名</label><input id="f-name" maxlength="40">
    <label>年龄</label><input id="f-age" type="number" min="1" max="150">
    <label>班级</label><input id="f-class" maxlength="40">
    <label>成绩</label><input id="f-score" type="number" min="0" max="100">
    <div class="row">
      <button class="ghost" onclick="closeDialog()">取消</button>
      <button id="dialog-save" onclick="save()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const FIELDS = [
  { key: "id", title: "学号" },
  { key: "name", title: "姓名" },
  { key: "age", title: "年龄" },
  { key: "className", title: "班级" },
  { key: "score", title: "成绩" },
];
let students = [];
let order = "id", desc = false, editingId = null;

function toast(message, isError) {
  const node = document.getElementById("toast");
  node.textContent = message;
  node.className = isError ? "show err" : "show";
  setTimeout(() => { node.className = ""; }, 2600);
}

async function request(method, url, body) {
  const options = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) options.body = JSON.stringify(body);
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
  return data;
}

function renderHead() {
  const row = document.getElementById("head-row");
  row.innerHTML = "";
  for (const field of FIELDS) {
    const th = document.createElement("th");
    th.textContent = field.title;
    if (order === field.key) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = desc ? "▼" : "▲";
      th.appendChild(arrow);
    }
    th.onclick = () => { order = field.key; desc = (order === field.key && !desc) || field.key !== order ? field.key === order ? desc : false : false; sortBy(field.key); };
    row.appendChild(th);
  }
  const extra = document.createElement("th");
  extra.textContent = "操作";
  row.appendChild(extra);
}

function sortBy(field) {
  if (order === field) { desc = !desc; } else { order = field; desc = false; }
  renderHead();
  load();
}

function renderRows() {
  const body = document.getElementById("rows");
  body.innerHTML = "";
  if (!students.length) {
    body.innerHTML = '<tr><td class="empty" colspan="9">暂无数据，点右上角「新增学生」试试</td></tr>';
    return;
  }
  for (const student of students) {
    const tr = document.createElement("tr");
    for (const field of FIELDS) {
      const td = document.createElement("td");
      td.textContent = student[field.key];
      tr.appendChild(td);
    }
    const actions = document.createElement("td");
    actions.className = "actions";
    const edit = document.createElement("button");
    edit.className = "ghost"; edit.textContent = "编辑";
    edit.onclick = () => openEdit(student);
    const remove = document.createElement("button");
    remove.className = "danger"; remove.textContent = "删除";
    remove.onclick = () => removeStudent(student);
    actions.appendChild(edit); actions.appendChild(remove);
    tr.appendChild(actions);
    body.appendChild(tr);
  }
  const scores = students.map(s => s.score);
  document.getElementById("stat-count").textContent = students.length;
  document.getElementById("stat-avg").textContent = scores.length
    ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : "-";
  document.getElementById("stat-max").textContent = scores.length ? Math.max(...scores) : "-";
}

async function load() {
  try {
    const keyword = document.getElementById("search").value.trim();
    const query = new URLSearchParams();
    if (keyword) query.set("search", keyword);
    query.set("order", order);
    if (desc) query.set("desc", "1");
    students = await request("GET", "/api/students?" + query.toString());
    renderRows();
  } catch (error) { toast(error.message, true); }
}

function clearSearch() { document.getElementById("search").value = ""; load(); }

function openDialog(title, student) {
  editingId = student ? student.id : null;
  document.getElementById("dialog-title").textContent = title;
  document.getElementById("f-id").value = student ? student.id : "";
  document.getElementById("f-id").disabled = !!student;
  document.getElementById("f-name").value = student ? student.name : "";
  document.getElementById("f-age").value = student ? student.age : "";
  document.getElementById("f-class").value = student ? student.className : "";
  document.getElementById("f-score").value = student ? student.score : "";
  document.getElementById("mask").classList.add("show");
}

function openAdd() { openDialog("新增学生", null); }
function openEdit(student) { openDialog("编辑学生（学号 " + student.id + "）", student); }
function closeDialog() { document.getElementById("mask").classList.remove("show"); }

async function save() {
  const payload = {
    id: Number(document.getElementById("f-id").value) || 0,
    name: document.getElementById("f-name").value.trim(),
    age: Number(document.getElementById("f-age").value) || 0,
    className: document.getElementById("f-class").value.trim(),
    score: Number(document.getElementById("f-score").value) || 0,
  };
  try {
    if (editingId === null) {
      const saved = await request("POST", "/api/students", payload);
      toast("已保存，学号 " + saved.id);
    } else {
      await request("PUT", "/api/students/" + editingId, payload);
      toast("已更新学号 " + editingId);
    }
    closeDialog(); load();
  } catch (error) { toast(error.message, true); }
}

async function removeStudent(student) {
  if (!confirm("确定删除学号 " + student.id + "（" + student.name + "）？")) return;
  try { await request("DELETE", "/api/students/" + student.id); toast("已删除"); load(); }
  catch (error) { toast(error.message, true); }
}

async function loadSchema() {
  try {
    const schema = await request("GET", "/api/schema");
    document.getElementById("stat-schema").textContent = schema.fields.length;
  } catch (error) { /* 静默：统计卡而已 */ }
}

document.getElementById("search").addEventListener("keydown", event => {
  if (event.key === "Enter") load();
});

renderHead();
load();
loadSchema();
</script>
</body>
</html>
