<text x="72" y="154" style="font-size:18px;font-weight:650;fill:white">浏览器 · 三角色页面</text>
<text x="72" y="183" style="font-size:14px;fill:#c8d8ed">登录／总览／六类管理视图</text>
<text x="72" y="208" style="font-size:14px;fill:#c8d8ed">文本安全输出 · 筛选 · 分页</text>
<rect x="490" y="120" width="660" height="123" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="512" y="154" class="heading">HTTP 入口 · main.chl / httpd.chl</text>
<text x="512" y="183" class="body">有界读取请求／返回首页与 JSON</text>
<path class="arrow" d="M410 181H490"/>
<text x="418" y="166" class="label">HTTP</text>
<rect x="490" y="285" width="660" height="103" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="512" y="319" class="heading">路由 · school_api.chl</text>
<text x="512" y="348" class="body">业务 API 分派前先验证会话</text>
<path class="arrow" d="M820 243V285"/>
<text x="835" y="270" class="label">Bearer 令牌／JSON</text>
<rect x="50" y="438" width="510" height="120" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="72" y="472" class="heading">认证 · school_auth.chl</text>
<text x="72" y="501" class="body">口令派生验证／令牌／到期／账号版本</text>
<rect x="640" y="438" width="510" height="120" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="662" y="472" class="heading">业务 · school_data / school_accounts</text>
<text x="662" y="501" class="body">角色检查／授课范围／字段校验／增删改查</text>
<path class="arrow" d="M760 388V410H305V438"/><path class="arrow" d="M820 388V410H895V438"/>
<path class="arrow" d="M560 497H640"/>
<text x="571" y="485" class="label">User</text>
<rect x="50" y="655" width="510" height="115" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="72" y="689" class="heading">Windows CNG · bcrypt.dll</text>
<text x="72" y="718" class="body">系统随机数／PBKDF2-HMAC-SHA256</text>
<rect x="640" y="640" width="510" height="145" rx="13" fill="#fff" stroke="#d6e0ef"/>
<text x="662" y="674" class="heading">MySQL · school_* 表</text>
<text x="662" y="703" class="body">账号／班级／科目／教师／学生</text>
<text x="662" y="728" class="body">授课授权／成绩／外键约束</text>
<path class="arrow" d="M305 558V655"/><path class="arrow" d="M895 558V640"/><path class="arrow" d="M490 558V598H700V640"/>
<text x="320" y="611" class="label">系统 C ABI</text>
<text x="910" y="608" class="label">值转义／固定表名列名</text>
<text x="50" y="835" class="sub">会话保存在当前进程中，服务重启后重新登录；保留既有 students 表及其数据。</text>
