<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#6d86b2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="880" fill="#f5f7fb"/>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#182c49}.title{font-size:28px;font-weight:650}.sub{font-size:15px;fill:#64748b}.heading{font-size:18px;font-weight:650}.body{font-size:14px;fill:#50657f}.label{font-size:13px;fill:#466293}.arrow{stroke:#6d86b2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="48" y="55" class="title">学生信息管理系统</text>
<text x="48" y="85" class="sub">请求、权限与持久化数据的边界</text>
